name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ── Docker image → ghcr.io ────────────────────────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/meisdy/job-app:latest
            ghcr.io/meisdy/job-app:${{ github.ref_name }}

      # ── GitHub Release: notes ─────────────────────────────────────────────
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |

            ---
            ## Install (Linux, Docker)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Meisdy/Job-App/master/setup.sh | bash
            ```
            Images for `linux/amd64` and `linux/arm64` are on ghcr.io. On Windows, run this inside WSL2 — there is no native Windows build.

            To pin this exact version instead of `latest`, see [MANUAL.md](https://github.com/Meisdy/Job-App/blob/master/MANUAL.md#docker-pinning-a-version).

            (The "Source code" archives below are auto-generated by GitHub — not the app.)
